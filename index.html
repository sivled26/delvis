<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu vida resuelta con Delvis y Lismar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f2a43;
    --fg: #fff6e0;
    --accent: #ffc83d;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    display: grid;
    place-items: center;
    padding: 2rem;
    font-family: "Archivo Black", Impact, "Arial Black", sans-serif;
  }
  h1 {
    text-align: center;
    text-transform: uppercase;
    line-height: 1.02;
    letter-spacing: -0.01em;
    font-weight: 400;
    font-size: clamp(2.4rem, 9vw, 6.5rem);
    max-width: 14ch;
  }
  h1 span { display: block; }
  .nombres { color: var(--accent); }
</style>
</head>
<body>
  <h1>
    <span>Tu vida resuelta con</span>
    <span class="nombres">Delvis y Lismar</span>
  </h1>
</body>
</html>
